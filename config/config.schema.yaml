$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - samples
  - reference
  - recombination
  - accessory
  - functional
  - integration
  - phylogeny
  - temporal
  - resources
properties:
  samples:
    type: string
    minLength: 1
  reference:
    type: object
    additionalProperties: false
    required: [mode, sample, path, max_contigs, length_tolerance_fraction]
    properties:
      mode:
        type: string
        enum: [auto, sample, path]
      sample:
        type: [string, "null"]
      path:
        type: [string, "null"]
      max_contigs:
        type: integer
        minimum: 1
      length_tolerance_fraction:
        type: number
        minimum: 0
        maximum: 1
  recombination:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled:
        type: boolean
  accessory:
    type: object
    additionalProperties: false
    required: [enabled, clean_mode, core_threshold]
    properties:
      enabled:
        type: boolean
      clean_mode:
        type: string
        enum: [strict, moderate, sensitive]
      core_threshold:
        type: number
        minimum: 0.5
        maximum: 1.0
  functional:
    type: object
    additionalProperties: false
    required: [enabled, databases]
    properties:
      enabled:
        type: boolean
      databases:
        type: array
        items:
          type: string
        uniqueItems: true
  integration:
    type: object
    additionalProperties: false
    required: [low_snp_threshold, high_accessory_distance]
    properties:
      low_snp_threshold:
        type: integer
        minimum: 0
      high_accessory_distance:
        type: number
        minimum: 0
        maximum: 1
  phylogeny:
    type: object
    additionalProperties: false
    required: [model, bootstrap, alrt, seed]
    properties:
      model:
        type: string
        minLength: 1
      bootstrap:
        type: integer
        minimum: 0
      alrt:
        type: integer
        minimum: 0
      seed:
        type: integer
        minimum: 1
  temporal:
    type: object
    additionalProperties: false
    required: [mode, min_dated_samples, min_year_span, min_r2, coalescent]
    properties:
      mode:
        type: string
        enum: [off, screen, auto, on]
      min_dated_samples:
        type: integer
        minimum: 3
      min_year_span:
        type: number
        minimum: 0
      min_r2:
        type: number
        minimum: 0
        maximum: 1
      coalescent:
        type: string
        enum: [skyline, opt, const]
  resources:
    type: object
    additionalProperties: false
    required: [snippy_threads, iqtree_threads, gubbins_threads, prokka_threads, panaroo_threads]
    properties:
      snippy_threads:
        type: integer
        minimum: 1
      iqtree_threads:
        type: integer
        minimum: 1
      gubbins_threads:
        type: integer
        minimum: 1
      prokka_threads:
        type: integer
        minimum: 1
      panaroo_threads:
        type: integer
        minimum: 1
