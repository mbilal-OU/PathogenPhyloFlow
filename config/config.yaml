samples: config/samples.example.tsv

reference:
  mode: auto
  sample: null
  path: null
  max_contigs: 500
  length_tolerance_fraction: 0.25

recombination:
  enabled: true
  # Masking strategy for Gubbins-implicated intervals:
  #   global    - mask the union of intervals in every sequence (conservative default)
  #   per_taxon - mask each interval only in its implicated taxon (preserves signal)
  masking: global

accessory:
  enabled: true
  clean_mode: strict
  core_threshold: 0.95

functional:
  enabled: false
  databases:
    - resfinder
    - vfdb

integration:
  low_snp_threshold: 10
  high_accessory_distance: 0.25

phylogeny:
  model: MFP
  bootstrap: 1000
  alrt: 1000
  seed: 20260830

temporal:
  mode: screen
  min_dated_samples: 10
  min_year_span: 1.0
  min_r2: 0.10
  coalescent: skyline

resources:
  snippy_threads: 4
  iqtree_threads: 4
  gubbins_threads: 4
  prokka_threads: 4
  panaroo_threads: 4
  # Memory (MB) advertised to the scheduler per rule. snippy's samtools sort
  # allocation is controlled separately by snippy_ram_gb (GB).
  snippy_ram_gb: 8
  gubbins_mem_mb: 16000
  iqtree_mem_mb: 8000
  prokka_mem_mb: 4000
  panaroo_mem_mb: 16000
