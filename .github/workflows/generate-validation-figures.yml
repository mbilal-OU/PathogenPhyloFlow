name: Generate validation figures

on:
  push:
    branches: [main]
    paths:
      - 'docs/scripts/generate_validation_figures.py'
      - 'examples/ecoli_o157/ci_samples.tsv'
      - 'examples/ecoli_o157/results_preview/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip matplotlib numpy biopython

      - name: Generate academic SVG figures
        run: python docs/scripts/generate_validation_figures.py

      - name: Commit regenerated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ecoli_o157_validation_snapshot.svg \
                  docs/assets/ecoli_o157_tree_comparison.svg \
                  docs/assets/ecoli_o157_snp_accessory.svg \
                  docs/assets/ecoli_o157_temporal_screen.svg
          if git diff --cached --quiet; then
            echo "Figures are already current."
          else
            git commit -m "Regenerate academic validation figures"
            git push
          fi
