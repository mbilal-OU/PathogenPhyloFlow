name: Publish version release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - "docs/releases/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CITATION_VERSION=$(awk '/^version:/ {print $2}' CITATION.cff)
          test "$CITATION_VERSION" = "$VERSION"
          test -f "docs/releases/v${VERSION}.md"

      - name: Create tag and GitHub release if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "PathogenPhyloFlow ${TAG}"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "PathogenPhyloFlow ${TAG}" \
            --notes-file "$NOTES"
