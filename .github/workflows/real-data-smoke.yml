name: Real-data smoke test

on:
  push:
    branches: [main]
    paths:
      - "examples/ecoli_o157/**"
      - "workflow/scripts/resolve_input.py"
      - ".github/workflows/real-data-smoke.yml"
  pull_request:
    paths:
      - "examples/ecoli_o157/**"
      - "workflow/scripts/resolve_input.py"
      - ".github/workflows/real-data-smoke.yml"
  workflow_dispatch:

jobs:
  resolve-public-assemblies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up NCBI Datasets
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflow/envs/input.yaml
          environment-name: pathogenphyloflow-input
          cache-environment: true

      - name: Validate curated sample sheet
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("examples/ecoli_o157/samples.tsv")
          with path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))

          assert len(rows) == 10, f"Expected 10 isolates, found {len(rows)}"
          samples = [r["sample"].strip() for r in rows]
          assert len(samples) == len(set(samples)), "Duplicate sample identifiers"
          for row in rows:
              accession = row["accession"].strip()
              assert accession.startswith(("GCA_", "GCF_")), accession
              assert not row["assembly"].strip(), row["sample"]
          print(f"Validated {len(rows)} curated O157:H7 accessions")
          PY

      - name: Resolve every NCBI assembly accession
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import csv
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path("/tmp/pathogenphyloflow-smoke")
          root.mkdir(parents=True, exist_ok=True)
          manifest = []

          with open("examples/ecoli_o157/samples.tsv", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))

          for row in rows:
              sample = row["sample"].strip()
              accession = row["accession"].strip()
              print(f"Checking {sample}: {accession}", flush=True)
              archive = root / f"{sample}.zip"
              outdir = root / sample
              subprocess.run(
                  [
                      "datasets", "download", "genome", "accession", accession,
                      "--include", "genome", "--filename", str(archive),
                  ],
                  check=True,
              )
              outdir.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(outdir)
              fastas = list(outdir.rglob("*.fna"))
              if not fastas:
                  raise RuntimeError(f"No genome FASTA found for {sample} ({accession})")
              manifest.append((sample, accession, "resolved"))

          with open("accession_validation.tsv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle, delimiter="\t")
              writer.writerow(["sample", "accession", "status"])
              writer.writerows(manifest)

          print(f"Resolved {len(manifest)} public assemblies")
          PY

      - name: Show validation manifest
        shell: bash -el {0}
        run: cat accession_validation.tsv

      - name: Upload validation manifest
        uses: actions/upload-artifact@v4
        with:
          name: ecoli-o157-accession-validation
          path: accession_validation.tsv
