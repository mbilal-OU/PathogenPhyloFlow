name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml jsonschema
      - name: Compile Python sources
        run: python -m compileall workflow tests
      - name: Run unit tests
        run: pytest -q

  snakemake-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Snakemake
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake>=8"
      - name: Lint workflow
        run: snakemake --lint --snakefile workflow/Snakefile
